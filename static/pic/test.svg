<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" style="background-color: #f4f4f4;">
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f4f4f4"/>
  
  <!-- 标题 -->
  <text x="50%" y="40" text-anchor="middle" font-size="24" fill="#333">最近走势</text>
  
  <!-- 折线图 -->
  <g transform="translate(100, 100)">
    <!-- 网格线 -->
    <line x1="0" y1="0" x2="800" y2="0" stroke="#ddd" />
    <line x1="0" y1="50" x2="800" y2="50" stroke="#ddd" />
    <line x1="0" y1="100" x2="800" y2="100" stroke="#ddd" />
    
    <!-- 折线 -->
    <polyline points="0,100 80,60 160,40 240,90 320,30 400,80 480,20 560,70 640,40 720,100" fill="none" stroke="#888" stroke-width="2"/>
    
    <!-- 点 -->
    <circle cx="0" cy="100" r="5" fill="red"/>
    <circle cx="80" cy="60" r="5" fill="green"/>
    <circle cx="160" cy="40" r="5" fill="green"/>
    <!-- 其他点省略 -->
  </g>

  <!-- 左侧文本信息 -->
  <g transform="translate(50, 200)">
    <text x="0" y="20" font-size="14" fill="#333">记录场数: 235</text>
    <text x="0" y="40" font-size="14" fill="#333">和牌率: 31.33%</text>
    <text x="0" y="60" font-size="14" fill="#333">自摸率: 39.32%</text>
    <!-- 其他数据可按需添加 -->
  </g>

  <!-- 右侧饼图 -->
  <g transform="translate(750, 300)">
    <!-- 饼图部分 -->
    <path d="M 0,0 L 100,0 A 100,100 0 0,1 70,-70 Z" fill="#4CAF50"/> <!-- 第一部分 -->
    <path d="M 0,0 L 70,-70 A 100,100 0 0,1 -70,70 Z" fill="#FF5722"/> <!-- 第二部分 -->
    <path d="M 0,0 L -70,70 A 100,100 0 0,1 100,0 Z" fill="#9E9E9E"/> <!-- 第三部分 -->
    
    <!-- 饼图文字 -->
    <text x="120" y="-10" font-size="14" fill="#4CAF50">34.89%</text>
    <text x="-10" y="-120" font-size="14" fill="#FF5722">30.64%</text>
    <text x="-140" y="10" font-size="14" fill="#9E9E9E">34.47%</text>
  </g>
</svg>
